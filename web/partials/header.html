{% load static %}
<header id="sisf-page-header" class="sisf-main-header mt-3 sis-br-radius sisf-standerd-header">
   <div class="sis-main-header">
      <div class="sis-header-sticky active">
         <div id="sisf-page-header-inner" class="sisf-skin--light position-relative d-flex align-items-center">
            <div class="container px-2">
               <a class="navbar-brand sisf-header-logo-link mobile-block" href="{% url 'index' %}">
                  <img src="{% static 'web/images/logo/logooo.png' %}" alt="Logo">
               </a>
               <div class="sisf-centered-header-wrapper sisf--header d-flex justify-content-between align-items-center">
                  <a class="navbar-brand sisf-header-logo-link" href="{% url 'index' %}">
                     <img src="{% static 'web/images/logo/logooo.png' %}" alt="Logo" style="width:200px;">
                  </a>
                  <nav class="navbar navbar-expand-lg">
                     <div class="collapse navbar-collapse sis-main-menu">
                        <div class="nav-menu-wrapper">
                           <ul class="navbar-nav sis-active-sticky-header mr-auto" id="menu">
                              <li class="nav-item">
                                 <a class="nav-link{% if request.resolver_match and request.resolver_match.url_name == 'index' %} active{% endif %}" href="{% url 'index' %}">Home</a>
                              </li>
                              <li class="nav-item">
                                 <a class="nav-link{% if request.resolver_match and request.resolver_match.url_name == 'about' %} active{% endif %}" href="{% url 'about' %}">About Us</a>
                              </li>
                              <li class="nav-item">
                                 <a class="nav-link{% if request.resolver_match and request.resolver_match.url_name == 'services' %} active{% endif %}" href="{% url 'services' %}">Services</a>
                              </li>
                              <li class="nav-item">
                                 <a class="nav-link{% if request.resolver_match and request.resolver_match.url_name == 'products' %} active{% endif %}" href="{% url 'products' %}">Products</a>
                              </li>
                              <li class="nav-item">
                                 <a class="nav-link{% if request.resolver_match and request.resolver_match.url_name == 'gallery' %} active{% endif %}" href="{% url 'gallery' %}">Gallery</a>
                              </li>
                              <li class="nav-item">
                                 <a class="nav-link{% if request.resolver_match and request.resolver_match.url_name == 'contact' %} active{% endif %}" href="{% url 'contact' %}">Contact</a>
                              </li>
                           </ul>
                        </div>
                     </div>
                  </nav>
                  <div class="sisf-widget-holder sisf--two d-flex align-items-center">
                     <div class="header-btn">
                        <a href="{% url 'contact' %}" class="sis-btn-default">Book Now</a>
                     </div>
                  </div>
               </div>
               <div class="navbar-toggle"></div>
               <div class="responsive-menu"></div>
            </div>
         </div>
      </div>
   </div>
</header>
