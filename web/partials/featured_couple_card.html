<div class="col-lg-3 col-md-6">
   <div class="sisf-sis-team-member sisf-item-layout-info-from-bottom mb-4 pb-2 page aos-init aos-animate"
      data-aos="fade-up" data-aos-delay="100" data-aos-duration="1200">
      <div class="sisf-e-inner position-relative">
         <div class="sis-image-with-icons position-relative">
            <div class="sis-team-members-img">
               <figure class="sis-image-anime">
                  <img src="{{ couple.image.url }}" class="w-100" alt="{{ couple.couple_name }}">
               </figure>
            </div>
         </div>
         <div class="sis-team-member-content">
            <div class="contents-out">
               <h4 class="sisf-m-title mb-1">{{ couple.couple_name }}</h4>
            </div>
         </div>
      </div>
   </div>
</div>
